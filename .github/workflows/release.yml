name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # release-please reads release-please-config.json + .release-please-manifest.json
  # (manifest / monorepo mode). On a conventional-commit push it maintains one
  # "release PR" per changed package; merging that PR bumps the package version,
  # updates its CHANGELOG, tags it (e.g. sap-api-hub-mcp-vX.Y.Z), and sets the
  # per-path release outputs consumed by the publish job below.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      notes_release_created: ${{ steps.release.outputs['packages/notes--release_created'] }}
      notes_tag_name: ${{ steps.release.outputs['packages/notes--tag_name'] }}
      notes_version: ${{ steps.release.outputs['packages/notes--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v4
        id: release

  # Publishes ONLY the packages release-please just released, to npm, with
  # provenance via OIDC trusted publishing (no long-lived NPM_TOKEN needed —
  # see AGENTS.md "Releasing" for the one-time npm trusted-publisher setup).
  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing + --provenance
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm (>= 11.5 required for OIDC trusted publishing)
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build (auth → servers)
        run: npm run build

      - name: Publish released packages
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          set -euo pipefail
          echo "release-please released: $PATHS_RELEASED"
          for path in $(jq -r '.[]' <<< "$PATHS_RELEASED"); do
            echo "::group::npm publish $path"
            npm publish --workspace "$path" --provenance --access public
            echo "::endgroup::"
          done

  # SAP Notes is distributed as a tiny reference bundle: the MCPB contains only
  # its manifest and icon, while npx installs the released server package.
  build-notes-mcpb:
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.notes_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate and pack SAP Notes MCPB
        env:
          MCPB: '@anthropic-ai/mcpb@2.1.2'
          VERSION: ${{ needs.release-please.outputs.notes_version }}
        run: |
          set -euo pipefail
          test "$(jq -r .version packages/notes/mcpb-bundle/manifest.json)" = "$VERSION"
          npx --yes "$MCPB" validate packages/notes/mcpb-bundle/manifest.json
          npx --yes "$MCPB" pack packages/notes/mcpb-bundle "sap-notes-${VERSION}.mcpb"
          unzip -p "sap-notes-${VERSION}.mcpb" manifest.json | jq .
          cp "sap-notes-${VERSION}.mcpb" sap-notes.mcpb

      - name: Attach MCPB to SAP Notes release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.notes_tag_name }}
          VERSION: ${{ needs.release-please.outputs.notes_version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" "sap-notes-${VERSION}.mcpb" sap-notes.mcpb --clobber

          if ! gh release view sap-notes-latest >/dev/null 2>&1; then
            gh release create sap-notes-latest \
              --target "$GITHUB_SHA" \
              --title "SAP Notes MCPB (latest)" \
              --notes "Stable download target for the latest SAP Notes MCPB bundle." \
              --prerelease \
              --latest=false
          fi
          gh release upload sap-notes-latest sap-notes.mcpb --clobber

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# No Playwright browser needed to build/typecheck — skip the postinstall download.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # Build compiles every workspace with tsc (auth first, then the servers),
  # which is the real type-check for all four packages. The servers' own
  # `test` scripts hit live SAP and are intentionally NOT run in CI.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.12.0, 22.x]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (auth → servers)
        run: npm run build

      - name: Smoke test published MCP bins
        run: npm run smoke:bin

      - name: Type check
        run: npm run typecheck

  # Lint the conventional-commit messages introduced by a PR. Skipped for
  # release-please and Dependabot PRs (their commits are auto-generated and
  # already conventional — chore(deps): / chore: release).
  commitlint:
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint PR commit messages
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
